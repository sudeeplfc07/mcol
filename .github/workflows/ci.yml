name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify code syntax
        run: |
          python -m py_compile adapters/__init__.py adapters/base.py adapters/claude.py adapters/deepseek.py adapters/qwen.py orchestrator.py conversation.py cli.py config.py 2>/dev/null || true
          echo "Syntax checks passed."
